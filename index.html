<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K-Code Art | 한글 그림 생성기</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="c.css">
  <link rel="stylesheet" href="navigation.css">
  <link rel="stylesheet" href="modern-ui.css">
  <script src="https://code.jquery.com/jquery-latest.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/es6-promise@4/dist/es6-promise.auto.min.js"></script>
  <script src="j.js"></script>
</head>
<body class="container">
  <header class="site-header site-header--generator">
    <div class="site-header__inner">
      <a class="site-brand brand-wordmark" href="index.html" aria-label="K-Code Art 홈">
        <span class="brand-title">K-Code Art</span>
        <span class="brand-subtitle">The Generative Code of Hangul</span>
      </a>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="principle.html">원리</a>
        <a href="https://smartstore.naver.com/hggbs" target="_blank" rel="noopener noreferrer">구매</a>
      </nav>
    </div>
  </header>

  <main class="studio-shell">
    <section class="style-section" aria-labelledby="style-heading">
      <p class="style-tooltip" role="tooltip"><span aria-hidden="true">✦</span>어떤 모양으로 한글을 표현해볼까요?</p>
      <div class="style-toolbar">
        <h1 id="style-heading">그림꼴</h1>
        <div class="style-tabs" role="tablist" aria-label="그림꼴 선택"></div>
      </div>
      <select id="style_kind" class="selet_font native-style-select" title="그림꼴 선택" aria-hidden="true" tabindex="-1">
        <option value="0">색동</option>
        <option value="1">사각 조각보</option>
        <option value="2">팔각 조각보</option>
        <option value="3">원형 조각보</option>
        <option value="4">물수제비</option>
        <option value="5">한울림</option>
        <option value="6">입방체</option>
        <option value="7">단청</option>
        <option value="8">만화경</option>
        <option value="9">세모</option>
      </select>
    </section>

    <div class="studio-grid">
      <section class="creation-column" aria-label="한글 그림 만들기">
        <div class="canvas-frame">
          <img class="img_screen canvas-measure" src="images/한글창.png" alt="">
          <div id="captureArea">
            <div class="canvas-empty" aria-hidden="true">
              <span>한글을 입력하면 그림이 됩니다</span>
            </div>
            <div class="result2"></div>
            <p class="result" id="t_test"></p>
          </div>
        </div>

      </section>

      <aside class="control-panel">
        <div>
          <p class="panel-label">선택한 그림꼴</p>
          <p class="selected-style-name">색동</p>
          <figure class="style-preview" data-style="0">
            <div class="style-preview__stage">
              <img class="style-preview__image" src="색동.png" alt="색동 예시 이미지">
              <span class="style-preview__fallback" aria-hidden="true">ㄱ</span>
            </div>
          </figure>
          <p class="panel-description">입력한 한글의 소리와 구조가 선택한 그림꼴로 표현됩니다.</p>
        </div>
        <button id="capture" class="save-button" type="button">이미지 저장</button>
      </aside>

      <div class="input-shell">
        <label for="t">한글 입력</label>
        <div class="input-row">
          <textarea class="input" id="t" name="fname" rows="2" maxlength="16"
            placeholder="한글을 입력하세요" wrap="VIRTUAL" spellcheck="false"></textarea>
          <p class="result3" title="총 글자수">0 <span>/ 16</span></p>
        </div>
      </div>
    </div>

    <section class="jamo-section" aria-label="자음과 모음 색상">
      <div class="jamo-scroll" aria-label="자음과 모음 색상 목록">
        <div class="jamo-item"><button id="btn1" type="button" data-char="ㄱ" title="ㄱ #1A7CBD">ㄱ</button><span id="btn1_1">ㄱ</span></div>
        <div class="jamo-item"><button id="btn2" type="button" data-char="ㄲ" title="ㄲ #173349">ㄲ</button><span id="btn1_2">ㄲ</span></div>
        <div class="jamo-item"><button id="btn3" type="button" data-char="ㄴ" title="ㄴ #A5665D">ㄴ</button><span id="btn1_3">ㄴ</span></div>
        <div class="jamo-item"><button id="btn4" type="button" data-char="ㄷ" title="ㄷ #B81B22">ㄷ</button><span id="btn1_4">ㄷ</span></div>
        <div class="jamo-item"><button id="btn5" type="button" data-char="ㄸ" title="ㄸ #4D242A">ㄸ</button><span id="btn1_5">ㄸ</span></div>
        <div class="jamo-item"><button id="btn6" type="button" data-char="ㄹ" title="ㄹ #8E6C8D">ㄹ</button><span id="btn1_6">ㄹ</span></div>
        <div class="jamo-item"><button id="btn7" type="button" data-char="ㅁ" title="ㅁ #8F9648">ㅁ</button><span id="btn1_7">ㅁ</span></div>
        <div class="jamo-item"><button id="btn8" type="button" data-char="ㅂ" title="ㅂ #F6B71C">ㅂ</button><span id="btn1_8">ㅂ</span></div>
        <div class="jamo-item"><button id="btn9" type="button" data-char="ㅃ" title="ㅃ #59441F">ㅃ</button><span id="btn1_9">ㅃ</span></div>
        <div class="jamo-item"><button id="btn10" type="button" data-char="ㅅ" title="ㅅ #E9E0D9">ㅅ</button><span id="btn1_10">ㅅ</span></div>
        <div class="jamo-item"><button id="btn11" type="button" data-char="ㅆ" title="ㅆ #847771">ㅆ</button><span id="btn1_11">ㅆ</span></div>
        <div class="jamo-item"><button id="btn12" type="button" data-char="ㅇ" title="ㅇ #4D4D4D">ㅇ</button><span id="btn1_12">ㅇ</span></div>
        <div class="jamo-item"><button id="btn13" type="button" data-char="ㅈ" title="ㅈ #F2F2F2">ㅈ</button><span id="btn1_13">ㅈ</span></div>
        <div class="jamo-item"><button id="btn14" type="button" data-char="ㅉ" title="ㅉ #7F7F7F">ㅉ</button><span id="btn1_14">ㅉ</span></div>
        <div class="jamo-item"><button id="btn15" type="button" data-char="ㅊ" title="ㅊ #D9D9D9">ㅊ</button><span id="btn1_15">ㅊ</span></div>
        <div class="jamo-item"><button id="btn16" type="button" data-char="ㅋ" title="ㅋ #9CC9EA">ㅋ</button><span id="btn1_16">ㅋ</span></div>
        <div class="jamo-item"><button id="btn17" type="button" data-char="ㅌ" title="ㅌ #EAB4C4">ㅌ</button><span id="btn1_17">ㅌ</span></div>
        <div class="jamo-item"><button id="btn18" type="button" data-char="ㅍ" title="ㅍ #F2DD8C">ㅍ</button><span id="btn1_18">ㅍ</span></div>
        <div class="jamo-item"><button id="btn19" type="button" data-char="ㅎ" title="ㅎ #202020">ㅎ</button><span id="btn1_19">ㅎ</span></div>
        <div class="jamo-item"><button id="btn20" type="button" data-char="·" title="· #F0B800">·</button><span id="btn1_20">·</span></div>
        <div class="jamo-item"><button id="btn21" type="button" data-char="ㅡ" title="ㅡ #0A4A87">ㅡ</button><span id="btn1_21">ㅡ</span></div>
        <div class="jamo-item"><button id="btn22" type="button" data-char="ㅣ" title="ㅣ #99131A">ㅣ</button><span id="btn1_22">ㅣ</span></div>
      </div>
    </section>

    <div class="king-guide">
      <img class="king-character" src="images/킹세종.png" alt="세종대왕 캐릭터">
      <p class="king-speech" role="status" aria-live="polite"></p>
    </div>
    <footer class="site-footer">Copyright 2026. 메타세종. All Rights Reserved.</footer>
  </main>

  <a id="target" hidden></a>
  <script src="modern-ui.js"></script>
</body>
</html>
